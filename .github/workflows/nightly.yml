# Nightly: every repository the repos input marks to govern. It has no schedule of
# its own: a control plane calls it on one, or someone runs it by hand with that input.
#
# Reusable: a control plane calls this with `repos`, the repos file itself as
# JSON ({"repositories": [{"repo", "govern"}]}), and the secrets app-id, app-key,
# notify-token and notify-user. It takes pubfleet's wheel and the update script
# from the `pubfleet` input's latest release, whichever repository calls it,
# and the pubkit that release's tests/requirements.lock pins
# (.github/nightly/install.sh). So a pubkit release reaches governed
# repositories once pubfleet's own nightly has moved its lock to it and a
# pubfleet release carries it: a night later than pubkit's own release, and
# only once pubfleet's suite has passed with it. The `pubkit` input, a pubkit
# release tag, overrides that, for a fix that cannot wait.
#
# The report job checks each one out and runs `pubfleet freshness`: the job
# summary is one table of the pubkit each pins, whether it conforms to the
# latest standard, and its open exceptions.
#
# The update job then keeps one pull request per repository, on its
# pubkit-nightly branch, with up to four commits, which `pubkit nightly` makes
# in its checkout (.github/nightly/update.sh):
#
# 1. every outdated pub* pin: the installed pubkit (in any of its *-ci.yml
#    workflows), pubrel's release workflow and pubrel-version,
#    each tool ci.tools pins by tag, and the crates nightly.pins.crates names
#    in Cargo.lock;
# 2. the other crates' updates that cargo vet covers with an audit (no new
#    exemption) and cargo deny passes; the body lists each one skipped,
#    with what `cargo vet suggest` says it needs;
# 3. the npm packages, to the newest version each range in package.json
#    allows, in package-lock.json only;
# 4. tests/requirements.lock, re-resolved from requirements.txt.
#
# A repository's pubkit.json turns each language's updates off with, for
# example, `"update": { "node": false }`, or all of them with `"update":
# false`; the pins always come. Its CI checks advisories on every run
# either way.
#
# An open pull request is updated, never a second one opened. If its CI
# fails with the updates, the pins are tested alone, and the updates
# dropped when that passes. Nothing merges it: the Sustenaut bot DMs on
# Slack when it is green or fails.
#
# It pushes and opens pull requests as a GitHub App: the secrets app-id and
# app-key (its private key), or run by hand the variable
# NIGHTLY_APP_ID and the secret NIGHTLY_APP_KEY, give, for each governed repository, a token for that repository
# alone, with only contents, pull-requests and workflows write (and
# actions read, to wait for its CI), that expires within the hour. The app is installed on every owner whose
# repositories the input marks. Without NIGHTLY_APP_ID it falls back,
# with a warning, to PUBKIT_BUMP_TOKEN, a token that may push branches and
# open pull requests there; with neither, the job only reports.
# The secrets notify-token (a Slack bot's, chat:write) and notify-user, whom it
# DMs; run by hand, SUSTENAUT_SLACK_BOT_TOKEN and SLACK_DM_USER_ID.
name: nightly

on:
  workflow_dispatch:
    inputs:
      repos:
        type: string
        required: true
        description: 'The repos file itself, as JSON: {"repositories": [{"repo", "govern"}]}'
      pubkit:
        type: string
        default: ''
        description: 'A pubkit release tag, such as v0.33.1, to move governed repositories to instead of the one this pubfleet is tested with'
  workflow_call:
    inputs:
      repos:
        type: string
        required: true
        description: 'The repos file itself, as JSON: {"repositories": [{"repo", "govern"}]}'
      pubfleet:
        type: string
        default: Sustenaut/pubfleet
        description: The pubfleet whose latest release runs this
      pubkit:
        type: string
        default: ''
        description: 'A pubkit release tag, such as v0.33.1, to move governed repositories to instead of the one that pubfleet release is tested with'
    secrets:
      app-id:
        required: false
        description: The GitHub App that pushes and opens the pull requests
      app-key:
        required: false
        description: Its private key
      notify-token:
        required: false
        description: A Slack bot token, chat:write, that says how each pull request went
      notify-user:
        required: false
        description: Whom it DMs

env:
  # Called, the input; run by hand, this repository.
  PUBFLEET: '${{ inputs.pubfleet || github.repository }}'
  PUBKIT_TAG: '${{ inputs.pubkit }}'

jobs:
  report:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.report.outputs.repos }}
      tag: ${{ steps.wheel.outputs.tag }}
    steps:
      - id: wheel
        run: echo "tag=$(gh release view --repo "$PUBFLEET" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
        env: { GH_TOKEN: '${{ github.token }}' }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { repository: '${{ env.PUBFLEET }}', ref: '${{ steps.wheel.outputs.tag }}', path: pubfleet, persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      # What governed repositories move to: the pubkit pubfleet's latest release is
      # tested with (its lock), or the release the pubkit input names.
      - run: pubfleet/.github/nightly/install.sh "${{ steps.wheel.outputs.tag }}"
        env: { GH_TOKEN: '${{ github.token }}' }
      - id: report
        run: |
          governed=$(jq -c '[.repositories[] | select(.govern) | .repo]' <<< "$REPOS")
          mkdir repos
          for repo in $(jq -r '.[]' <<< "$governed"); do
            # A private repository can't be read here, only updated below: leave it out
            # of the report, rather than stopping every repository's update.
            git clone --quiet --depth 1 "https://github.com/$repo" "repos/${repo#*/}" \
              || echo "::warning::$repo can't be read for the report, so it isn't in it."
          done
          if [ -n "$(ls repos)" ]; then pubfleet freshness repos/*; fi
          echo "repos=$governed" >> "$GITHUB_OUTPUT"
        env: { REPOS: '${{ inputs.repos }}' }

  update:
    needs: report
    if: needs.report.outputs.repos != '[]'
    runs-on: ubuntu-latest
    # Waits for the pull request's CI, fuzzing included.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.report.outputs.repos) }}
    env:
      REPO: '${{ matrix.repo }}'
      APP_ID: '${{ secrets.app-id || vars.NIGHTLY_APP_ID }}'
    steps:
      # The app's token covers this repository alone: its owner and name.
      - id: where
        run: |
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"
      - if: env.APP_ID != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '${{ env.APP_ID }}'
          private-key: '${{ secrets.app-key || secrets.NIGHTLY_APP_KEY }}'
          owner: '${{ steps.where.outputs.owner }}'
          repositories: '${{ steps.where.outputs.name }}'
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-actions: read
      - id: token
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "::add-mask::$APP_TOKEN"
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "$BUMP_TOKEN" ]; then
            echo "::warning::No app-id or NIGHTLY_APP_ID: falling back to PUBKIT_BUMP_TOKEN for $REPO. Set up the Sustenaut nightly app (README, The nightly)."
            echo "token=$BUMP_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "No app-id, NIGHTLY_APP_ID or PUBKIT_BUMP_TOKEN: reporting only, no pull request for $REPO." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "present=$([ -n "$APP_TOKEN$BUMP_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          APP_TOKEN: '${{ steps.app.outputs.token }}'
          BUMP_TOKEN: '${{ secrets.PUBKIT_BUMP_TOKEN }}'
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { repository: '${{ env.PUBFLEET }}', ref: '${{ needs.report.outputs.tag }}', path: pubfleet, persist-credentials: false }
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      - if: steps.token.outputs.present == 'true'
        id: latest
        run: |
          latest() { gh release view --repo "$1" --json tagName --jq .tagName; }
          pubfleet/.github/nightly/install.sh "$TAG"
          # pubdeploy, whose sustenaut.bump hook `pubkit pins` calls: it moves
          # deploy.providers and the uses of pubdeploy's workflows, as bump does.
          deploy=$(latest Sustenaut/pubdeploy)
          python -m pip install --quiet \
            "https://github.com/Sustenaut/pubdeploy/releases/download/$deploy/pubdeploy-${deploy#v}-py3-none-any.whl"
          # The newest pubrel crates.io has: a tag can come before its crate.
          pubrel=$(pubfleet/.github/nightly/pubrel-version.sh "$(latest Sustenaut/pubrel)")
          echo "pubrel=$pubrel" >> "$GITHUB_OUTPUT"
        env: { GH_TOKEN: '${{ github.token }}', TAG: '${{ needs.report.outputs.tag }}' }
      - if: steps.token.outputs.present == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-vet
            ~/.cargo/bin/pubrel
          key: nightly-tools-0.20.2-0.10.2-${{ steps.latest.outputs.pubrel }}-${{ runner.os }}
      - if: steps.token.outputs.present == 'true'
        run: |
          command -v cargo-deny >/dev/null || cargo install --locked cargo-deny --version 0.20.2
          command -v cargo-vet >/dev/null || cargo install --locked cargo-vet --version 0.10.2
          command -v pubrel >/dev/null || cargo install --locked pubrel --version "$PUBREL"
        env: { PUBREL: '${{ steps.latest.outputs.pubrel }}' }
      - if: steps.token.outputs.present == 'true'
        run: |
          git clone --quiet "https://x-access-token:$GH_TOKEN@github.com/$REPO" repo
          cd repo
          ../pubfleet/.github/nightly/update.sh
        env:
          GH_TOKEN: '${{ steps.token.outputs.token }}'
          PUBREL: '${{ steps.latest.outputs.pubrel }}'
          SLACK_TOKEN: '${{ secrets.notify-token || secrets.SUSTENAUT_SLACK_BOT_TOKEN }}'
          SLACK_USER: '${{ secrets.notify-user || secrets.SLACK_DM_USER_ID }}'
