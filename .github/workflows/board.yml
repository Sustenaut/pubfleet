# Reusable: grade every repository the caller names, A to E, with
# `pubfleet board`, and keep board.json and index.html as the run's "board"
# artifact for 90 days, which is the board's history. It deploys nothing
# and writes nowhere: the caller's workflow publishes the page.
#
# The caller checks nothing out first: this workflow checks out the
# caller's repository, where its lock is, installs the pubfleet and pubkit its
# tests/requirements.lock pins (by hash, wheels only), and reads every repository
# named by `repos` with `token`, a fine-grained token that can only read
# (Metadata, Contents, Actions, Issues, Pull requests, Dependabot alerts,
# Code scanning alerts, Secret scanning alerts and Administration, all
# read). `sonar-token` reads private SonarQube Cloud projects; public ones
# need none.
name: board

on:
  workflow_call:
    inputs:
      lock:
        type: string
        default: tests/requirements.lock
        description: The hash-locked requirements, pubfleet's and pubkit's wheels among them, in the caller's repository
      repos:
        type: string
        required: true
        description: 'The repos file itself, as JSON: {"repositories": [{"repo", "protect", "govern", "project"}]}. In place of the two lists below.'
      rules:
        type: string
        default: ''
        description: Other rules than the ones pubfleet ships, in the caller's repository
    secrets:
      token:
        required: true
        description: A read-only fine-grained token covering every listed repository
      sonar-token:
        required: false
        description: Reads private SonarQube Cloud projects

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      - run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r "$LOCK"
        env: { LOCK: '${{ inputs.lock }}' }
      - shell: bash  # pipefail: a failed board fails the step, though tee succeeds
        run: |
          printf '%s' "$REPOS" > .pubkit-repos.json
          args=(--out site --repos .pubkit-repos.json)
          if [ -n "$RULES" ]; then args+=(--rules "$RULES"); fi
          pubfleet board "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: '${{ secrets.token }}'
          SONAR_TOKEN: '${{ secrets.sonar-token }}'
          REPOS: '${{ inputs.repos }}'
          RULES: '${{ inputs.rules }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: board
          path: |
            site/board.json
            site/index.html
          retention-days: 90
